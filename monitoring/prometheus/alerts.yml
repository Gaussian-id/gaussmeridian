# Prometheus Alerts for GaussMeridian

groups:
  - name: gaussmeridian_alerts
    interval: 30s
    rules:
      # ========================================================================
      # HIGH PRIORITY ALERTS
      # ========================================================================
      
      - alert: HighErrorRate
        expr: |
          (
            rate(gaussmeridian_errors_total[5m]) / 
            rate(gaussmeridian_requests_total[5m])
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"
          
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            rate(gaussmeridian_request_duration_seconds_bucket[5m])
          ) > 1.0
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High request latency (p95)"
          description: "p95 latency is {{ $value }}s (threshold: 1s)"
          
      - alert: ServiceDown
        expr: up{job="gaussmeridian"} == 0
        for: 1m
        labels:
          severity: critical
          component: service
        annotations:
          summary: "GaussMeridian service is down"
          description: "Service {{ $labels.instance }} has been down for more than 1 minute"
          
      - alert: DatabaseConnectionPoolExhausted
        expr: gaussmeridian_database_connections_active >= gaussmeridian_database_connections_max * 0.9
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "Connection pool is at {{ $value }} connections (90% of max)"
          
      # ========================================================================
      # MEDIUM PRIORITY ALERTS
      # ========================================================================
      
      - alert: HighMemoryUsage
        expr: |
          process_resident_memory_bytes{job="gaussmeridian"} > 
          4 * 1024 * 1024 * 1024
        for: 10m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value | humanize1024 }} (threshold: 4GB)"
          
      - alert: HighCPUUsage
        expr: |
          rate(process_cpu_seconds_total{job="gaussmeridian"}[5m]) > 0.8
        for: 10m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value | humanizePercentage }} (threshold: 80%)"
          
      - alert: LowCacheHitRate
        expr: |
          (
            rate(gaussmeridian_cache_hits_total[10m]) /
            (rate(gaussmeridian_cache_hits_total[10m]) + 
             rate(gaussmeridian_cache_misses_total[10m]))
          ) < 0.5
        for: 15m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is {{ $value | humanizePercentage }} (threshold: 50%)"
          
      - alert: RateLimitHitsIncreasing
        expr: |
          rate(gaussmeridian_rate_limit_hits_total[5m]) > 10
        for: 10m
        labels:
          severity: info
          component: rate_limiter
        annotations:
          summary: "High rate of rate limit hits"
          description: "{{ $value }} rate limit hits per second"
          
      # ========================================================================
      # PROVIDER ALERTS
      # ========================================================================
      
      - alert: ProviderDown
        expr: gaussmeridian_provider_health{status="healthy"} == 0
        for: 5m
        labels:
          severity: warning
          component: provider
        annotations:
          summary: "Provider {{ $labels.provider }} is down"
          description: "Provider has been unhealthy for more than 5 minutes"
          
      - alert: ProviderHighLatency
        expr: |
          histogram_quantile(0.95,
            rate(gaussmeridian_provider_request_duration_seconds_bucket[5m])
          ) > 5.0
        for: 10m
        labels:
          severity: warning
          component: provider
        annotations:
          summary: "Provider {{ $labels.provider }} has high latency"
          description: "p95 latency is {{ $value }}s (threshold: 5s)"
          
      - alert: ProviderErrorRate
        expr: |
          (
            rate(gaussmeridian_provider_errors_total[5m]) /
            rate(gaussmeridian_provider_requests_total[5m])
          ) > 0.1
        for: 5m
        labels:
          severity: warning
          component: provider
        annotations:
          summary: "High error rate for provider {{ $labels.provider }}"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 10%)"
          
      # ========================================================================
      # DATABASE ALERTS
      # ========================================================================
      
      - alert: SlowDatabaseQueries
        expr: |
          histogram_quantile(0.95,
            rate(gaussmeridian_database_query_duration_seconds_bucket[5m])
          ) > 0.5
        for: 10m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Slow database queries detected"
          description: "p95 query time is {{ $value }}s (threshold: 500ms)"
          
      - alert: DatabaseConnectionErrors
        expr: rate(gaussmeridian_database_connection_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Database connection errors"
          description: "{{ $value }} connection errors per second"
          
      # ========================================================================
      # BUSINESS METRICS ALERTS
      # ========================================================================
      
      - alert: HighCostPerRequest
        expr: |
          (
            rate(gaussmeridian_total_cost[5m]) /
            rate(gaussmeridian_requests_total[5m])
          ) > 0.10
        for: 15m
        labels:
          severity: info
          component: billing
        annotations:
          summary: "High cost per request"
          description: "Average cost per request is ${{ $value }} (threshold: $0.10)"
          
      - alert: UnusualTrafficPattern
        expr: |
          abs(rate(gaussmeridian_requests_total[5m]) - 
              rate(gaussmeridian_requests_total[5m] offset 1h)) /
          rate(gaussmeridian_requests_total[5m] offset 1h) > 0.5
        for: 10m
        labels:
          severity: info
          component: traffic
        annotations:
          summary: "Unusual traffic pattern detected"
          description: "Traffic changed by {{ $value | humanizePercentage }} compared to 1 hour ago"
          
      # ========================================================================
      # DISK & STORAGE ALERTS
      # ========================================================================
      
      - alert: DiskSpaceLow
        expr: |
          (
            node_filesystem_avail_bytes{mountpoint="/"} /
            node_filesystem_size_bytes{mountpoint="/"}
          ) < 0.15
        for: 10m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "Low disk space"
          description: "Only {{ $value | humanizePercentage }} disk space remaining"
          
      # ========================================================================
      # MoA ALERTS
      # ========================================================================
      
      - alert: MoAStrategyFailureRate
        expr: |
          (
            rate(gaussmeridian_moa_strategy_errors_total[5m]) /
            rate(gaussmeridian_moa_strategy_executions_total[5m])
          ) > 0.2
        for: 10m
        labels:
          severity: warning
          component: moa
        annotations:
          summary: "High MoA strategy failure rate"
          description: "Strategy {{ $labels.strategy }} failure rate is {{ $value | humanizePercentage }}"
          
      - alert: MoAAgentUnresponsive
        expr: gaussmeridian_moa_agent_health{status="healthy"} == 0
        for: 5m
        labels:
          severity: warning
          component: moa
        annotations:
          summary: "MoA agent {{ $labels.agent_id }} is unresponsive"
          description: "Agent has been unhealthy for more than 5 minutes"

