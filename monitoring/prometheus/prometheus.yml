# =============================================================================
# Prometheus Configuration for GaussMeridian
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'gaussmeridian'

# Alerting Configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093  # Uncomment when Alertmanager is configured

# Rule Files
rule_files:
  - /etc/prometheus/alerts.yml

# Scrape Configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

  # GaussMeridian Backend Metrics
  - job_name: 'gaussmeridian'
    static_configs:
      - targets: ['gaussmeridian:8000']
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: gaussmeridian

  # Redis Metrics (requires redis_exporter)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # SurrealDB Metrics
  # - job_name: 'surrealdb'
  #   static_configs:
  #     - targets: ['surrealdb:8000']
  #   metrics_path: /metrics

# Remote Write Configuration (optional)
# remote_write:
#   - url: "http://remote-prometheus:9090/api/v1/write"
