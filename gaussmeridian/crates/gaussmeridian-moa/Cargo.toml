[package]
name = "gaussmoa"
version = "0.1.0"
edition = "2021"
authors = ["Risman Adnan <rismana@gmail.com>"]
description = "Advanced Mixture-of-Agents implementation in Rust"
license = "AGPL-3.0-only"
repository = "https://github.com/rismandev/gaussmoa_rs"
keywords = ["ai", "llm", "mixture-of-agents", "machine-learning"]
categories = ["science", "ai"]
build = "build.rs"
links = "zerocopy"
documentation = "https://docs.rs/gaussmoa"
readme = "README.md"

[dependencies]
rig-core = "0.3"
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
config = "0.14"
redb = "1.0"
reqwest = { version = "0.11", features = ["json"] }
async-trait = "0.1"
futures = "0.3"
rayon = "1.10"
ndarray = "0.15"
linfa = "0.6"
linfa-clustering = "0.6"
linfa-nn = { version = "0.7" }
rand = "0.8"
rand_distr = "0.4"
num-traits = "0.2"
clap = { version = "4.5", features = ["derive", "env"] }
dashmap = "5.0"
rustyline = { version = "13.0", features = ["with-file-history"] }
rustyline-derive = "0.10"
shellexpand = "3.1"
indicatif = "0.17"
console = "0.15"
crossterm = "0.27"
directories = "5.0"
once_cell = "1.0"
parking_lot = "0.12"
regex = "1.10"
tokio-util = { version = "0.7", features = ["full"] }
tower = { version = "0.4", features = ["limit", "load-shed", "timeout"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
keyring = { version = "2.0", optional = true }
secrecy = "0.8"
base64 = "0.21"
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = "1.7"
dotenv = "0.15"
async-stream = "0.3"
prometheus = { version = "0.13", optional = true }
metrics = { version = "0.21", optional = true }
metrics-exporter-prometheus = { version = "0.12", optional = true }
opentelemetry = { version = "0.20", features = ["rt-tokio"], optional = true }
opentelemetry-stdout = { version = "0.1", optional = true }
opentelemetry-otlp = { version = "0.13", optional = true }
opentelemetry-semantic-conventions = { version = "0.12", optional = true }
num_cpus = "1.16"
sys-info = "0.9"
bytes = "1.5"
syn = { version = "1.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
cached = "0.44"
winnow = "0.5"
lazy_static = "1.4"
toml = "0.8"
approx = "0.5.1"
bincode = "1.3"
validator = { version = "0.16", features = ["derive"] }
tracing-appender = "0.2"
lz4_flex = "0.11"
semver = { version = "1.0", features = ["serde"] }
tokio-stream = "0.1"
opentelemetry-jaeger = { version = "0.19", optional = true }

# tikv-jemallocator's upstream build requires a Unix-style make toolchain and rejects
# Windows build paths containing spaces. Keep the optional allocator available only on
# platforms where its build contract is supported; the crate does not install it as a
# global allocator on Windows.
[target.'cfg(not(windows))'.dependencies]
tikv-jemallocator = { version = "0.5", optional = true }

[build-dependencies]
cc = "1.0"

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.5", features = ["async_tokio"] }
mockall = "0.12"
pretty_assertions = "1.4"
test-case = "3.3"
proptest = "1.4"
fake = { version = "2.9", features = ["derive"] }
wiremock = "0.5"
tempfile = "3.10"
test-log = "0.2"

[features]
default = ["secure", "metrics", "storage"]
openai = []
anthropic = []
metrics = [
    "dep:metrics",
    "dep:metrics-exporter-prometheus", 
    "dep:opentelemetry", 
    "dep:opentelemetry-otlp", 
    "dep:opentelemetry-semantic-conventions",
    "dep:prometheus"
]
tracing = ["dep:opentelemetry", "dep:opentelemetry-otlp"]
jemalloc = ["dep:tikv-jemallocator"]
secure = ["dep:keyring"]
storage = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
debug-assertions = true
overflow-checks = true
lto = false
panic = "unwind"
incremental = true
codegen-units = 256
rpath = false

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.syn]
opt-level = 2
codegen-units = 1

[profile.bench]
lto = true
codegen-units = 1
