[package]
name = "gaussmeridian-metrics"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Metrics and observability for GaussMeridian"

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { version = "0.22", optional = true }
opentelemetry = { version = "0.22", features = ["trace"], optional = true }
opentelemetry_otlp = { package = "opentelemetry-otlp", version = "0.15", features = ["trace", "tonic"], optional = true }
opentelemetry_semantic_conventions = { package = "opentelemetry-semantic-conventions", version = "0.14" }
thiserror = { workspace = true }
chrono = { workspace = true }
prometheus = { workspace = true, optional = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true, optional = true }
serde_json = { workspace = true }

[features]
default = ["basic"]
basic = []
prometheus = ["dep:prometheus", "dep:metrics-exporter-prometheus"]
## Lightweight placeholder `tracing` feature to keep cfgs valid without
## pulling in the full OpenTelemetry stack by default. If you want full
## distributed tracing, extend this feature to include the OTEL deps.
tracing = []