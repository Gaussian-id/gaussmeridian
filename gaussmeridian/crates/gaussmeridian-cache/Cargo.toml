[package]
name = "gaussmeridian-cache"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
license = "AGPL-3.0-only"
repository = "https://github.com/your/repo"
keywords = ["ai", "cache", "router"]
categories = ["ai", "caching"]
description = "Caching implementations for GaussMeridian"

[dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
tracing = "0.1"

# Redis dependencies - align versions to avoid conflicts
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
deadpool-redis = { version = "0.15", features = ["rt_tokio_1"] }

# Compression and encryption (optional)
flate2 = { version = "1.0", optional = true }
lz4 = { version = "1.24", optional = true }
snap = { version = "1.1", optional = true }
zstd = { version = "0.13", optional = true }
brotli = { version = "6.0", optional = true }
aes = { version = "0.8", optional = true }
aes-gcm = { version = "0.10", optional = true }

# HTTP client for warming and semantic caching
reqwest = { version = "0.11", features = ["json"] }

# L1 in-process cache
moka = { workspace = true }

# Utilities
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
fastrand = "2.0"

[features]
default = ["memory", "redis"]
memory = []
redis = []
compression = ["flate2", "lz4", "snap", "zstd", "brotli"]
encryption = ["aes-gcm"]
warming = [] 