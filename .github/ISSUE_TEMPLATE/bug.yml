name: Bug report
description: Report a reproducible defect in GaussMeridian
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not disclose vulnerabilities or credentials here. Follow SECURITY.md for private reporting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Give sanitized steps, configuration shape, and relevant logs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or revision
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, deployment method, and component versions.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, personal data, and private infrastructure details.
          required: true
